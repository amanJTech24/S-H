<svg viewBox="0 0 60 60" width="60" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Antique Gold Gradient -->
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="30%" stop-color="#f0cb67" />
      <stop offset="65%" stop-color="#c99e32" />
      <stop offset="85%" stop-color="#936d1b" />
      <stop offset="100%" stop-color="#ffdc82" />
    </linearGradient>

    <!-- Powder Blue & Sapphire Radial Gradient -->
    <radialGradient id="cornerSapphire" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#d4e8fc" />
      <stop offset="70%" stop-color="#3d81c4" />
      <stop offset="100%" stop-color="#194575" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cornerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Right-Angle Frame with Scalloped Curve -->
  <path d="M 2,58 L 2,16 C 2,8 8,2 16,2 L 58,2" fill="none" stroke="url(#cornerGold)" stroke-width="2.2" stroke-linecap="round" filter="url(#cornerGlow)" />

  <!-- Inner Hairline Inset in Powder-Blue -->
  <path d="M 7,54 L 7,20 C 7,12.5 12.5,7 20,7 L 54,7" fill="none" stroke="rgba(110, 160, 205, 0.85)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Rajput Scalloped Trefoil Ornament in Corner Angle -->
  <path d="M 12,28 C 12,20 20,12 28,12 C 22,17 22,23 28,28 C 23,22 17,22 12,28 Z" fill="url(#cornerGold)" />

  <!-- Diagonal Vine Scroll Branch -->
  <path d="M 12,12 Q 22,22 36,36 M 16,20 Q 24,18 28,12 M 20,16 Q 18,24 12,28" fill="none" stroke="url(#cornerGold)" stroke-width="1" stroke-linecap="round" />

  <!-- Focal Sapphire Heart-Diamond Jewel Pivot Point -->
  <circle cx="9.5" cy="9.5" r="4.2" fill="url(#cornerSapphire)" stroke="#ffffff" stroke-width="0.8" filter="url(#cornerGlow)" />
  <!-- Diamond Sparkle Highlight -->
  <circle cx="8" cy="8" r="1.3" fill="#ffffff" />

  <!-- Border Line Floral Studs -->
  <circle cx="34" cy="4.5" r="1.8" fill="url(#cornerGold)" />
  <circle cx="48" cy="4.5" r="1.5" fill="url(#cornerGold)" />
  <circle cx="4.5" cy="34" r="1.8" fill="url(#cornerGold)" />
  <circle cx="4.5" cy="48" r="1.5" fill="url(#cornerGold)" />

  <!-- Miniature 4-Point Star Glint -->
  <polygon points="9.5,3 10.3,4.5 12,5 10.3,5.5 9.5,7 8.7,5.5 7,5 8.7,4.5" fill="#ffffff" opacity="0.85" />
</svg>