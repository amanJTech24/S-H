<svg viewBox="0 0 280 32" width="280" height="32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Antique Gold Gradient -->
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="25%" stop-color="#f0cb67" />
      <stop offset="65%" stop-color="#c99e32" />
      <stop offset="85%" stop-color="#936d1b" />
      <stop offset="100%" stop-color="#ffdc82" />
    </linearGradient>

    <!-- Sapphire Blue Radial Gradient -->
    <radialGradient id="crestSapphire" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#d4e8fc" />
      <stop offset="70%" stop-color="#3d81c4" />
      <stop offset="100%" stop-color="#194575" />
    </radialGradient>
  </defs>

  <!-- Left Vine & Scalloped Arch Ribbon -->
  <path d="M 10,16 Q 45,16 75,10 Q 105,4 125,12 Q 133,6 140,4 Q 147,6 155,12 Q 175,4 205,10 Q 235,16 270,16" 
        fill="none" stroke="url(#crestGold)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Inner Hairline Curve in Powder-Blue -->
  <path d="M 25,18 Q 55,18 85,12 Q 110,7 128,14 Q 134,9 140,8 Q 146,9 152,14 Q 170,7 195,12 Q 225,18 255,18" 
        fill="none" stroke="rgba(110, 160, 205, 0.75)" stroke-width="1" stroke-linecap="round" />

  <!-- Symmetrical Scalloped Arch Crest Peak -->
  <path d="M 132,14 C 132,9 135,5 140,2 C 145,5 148,9 148,14 Z" fill="url(#crestGold)" />

  <!-- Central Solitaire Sapphire Gemstone -->
  <circle cx="140" cy="8" r="3.6" fill="url(#crestSapphire)" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="138.8" cy="6.8" r="1.1" fill="#ffffff" />

  <!-- Flanking Pearl & Gold Beads -->
  <circle cx="118" cy="11" r="2.2" fill="url(#crestGold)" />
  <circle cx="162" cy="11" r="2.2" fill="url(#crestGold)" />
  <circle cx="95" cy="10" r="1.6" fill="url(#crestGold)" />
  <circle cx="185" cy="10" r="1.6" fill="url(#crestGold)" />
  <circle cx="70" cy="12" r="1.4" fill="url(#crestGold)" />
  <circle cx="210" cy="12" r="1.4" fill="url(#crestGold)" />

  <!-- Auspicious Star Accents -->
  <polygon points="140,16 141,18 143,19 141,20 140,22 139,20 137,19 139,18" fill="url(#crestGold)" />
</svg>