<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="monoGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EADCC6" />
      <stop offset="50%" stop-color="#C5AD79" />
      <stop offset="100%" stop-color="#9C8550" />
    </linearGradient>
    <linearGradient id="monoBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F8FD" />
      <stop offset="100%" stop-color="#D8E8F5" />
    </linearGradient>
    <filter id="embossShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="rgba(25, 59, 85, 0.12)" />
      <feDropShadow dx="0" dy="-1" stdDeviation="0.8" flood-color="rgba(255, 255, 255, 0.8)" result="highlight" />
    </filter>
  </defs>

  <!-- Embossed Ivory Disc -->
  <circle cx="50" cy="50" r="44" fill="url(#monoBlue)" stroke="url(#monoGold)" stroke-width="1.2" filter="url(#embossShadow)" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(169, 201, 229, 0.5)" stroke-width="0.8" stroke-dasharray="3 2" />

  <!-- Delicate Laurel Sprigs -->
  <path d="M 22 50 C 22 34, 34 22, 50 20 C 38 24, 26 36, 26 50 C 26 64, 38 76, 50 80 C 34 78, 22 66, 22 50 Z" fill="url(#monoGold)" opacity="0.4" />
  <path d="M 78 50 C 78 34, 66 22, 50 20 C 62 24, 74 36, 74 50 C 74 64, 62 76, 50 80 C 66 78, 78 66, 78 50 Z" fill="url(#monoGold)" opacity="0.4" />

  <!-- Monogram Text S & H -->
  <text x="35" y="56" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="600" font-size="22" fill="#193B55">S</text>
  <text x="50" y="54" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="16" fill="#C5AD79">&amp;</text>
  <text x="65" y="56" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="600" font-size="22" fill="#193B55">H</text>

  <!-- Tiny star accent below -->
  <circle cx="50" cy="68" r="1.5" fill="#C5AD79" />
</svg>